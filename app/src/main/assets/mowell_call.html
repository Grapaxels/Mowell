async function offerTo(id,state,iceRestart=false){if(state.closed)return;if(state.makingOffer||state.pc.signalingState!=='stable'){state.needsOffer=true;state.needsIceRestart=state.needsIceRestart||iceRestart;return}try{state.makingOffer=true;const offer=await state.pc.createOffer({iceRestart});await state.pc.setLocalDescription(offer);await signal('offer',state.pc.localDescription,id)}finally{state.makingOffer=false}if(state.needsOffer&&state.pc.signalingState==='stable'){const restart=state.needsIceRestart;state.needsOffer=false;state.needsIceRestart=false;await offerTo(id,state,restart)}}
function startConnectedTimer(){if(connectedAt)return;connectedAt=Date.now();const tick=()=>{const s=Math.floor((Date.now()-connectedAt)/1000),time=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('status').textContent='Connected · '+time;$('callTimerLabel').textContent=time};tick();callTimer=setInterval(tick,1000)}

async function createPeer(id,name,avatar,offer){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers,iceTransportPolicy:'all'}),remote=new MediaStream();const state={pc,remote,pending:[],name,avatar,makingOffer:false,needsOffer:false,needsIceRestart:false,restarts:0,restartTimer:null,closed:false};peers.set(id,state);stream.getTracks().forEach(t=>{const sender=pc.addTrack(t,stream);tuneSender(sender,t.kind)});pc.ontrack=e=>{if(!remote.getTracks().some(t=>t.id===e.track.id))remote.addTrack(e.track);e.track.onunmute=()=>attachRemote(id,state);e.track.onended=()=>{remote.removeTrack(e.track)};attachRemote(id,state)};pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate.toJSON?e.candidate.toJSON():e.candidate,id).catch(()=>{})};pc.oniceconnectionstatechange=()=>{if(pc.iceConnectionState==='disconnected')schedulePeerRecovery(id,state,1400);else if(pc.iceConnectionState==='failed')schedulePeerRecovery(id,state,100)};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){if(state.restartTimer)clearTimeout(state.restartTimer);state.restartTimer=null;state.restarts=0;everConnected=true;if(emptyTimer){clearTimeout(emptyTimer);emptyTimer=null}startConnectedTimer();upgradeLocalVideo();if(unansweredTimer)clearTimeout(unansweredTimer)}else if(pc.connectionState==='disconnected')schedulePeerRecovery(id,state,1400);else if(pc.connectionState==='failed'){schedulePeerRecovery(id,state,100);scheduleEmptyCheck()}};if(offer)await offerTo(id,state);return state}

if(s.senderId===C.userId)return;

}}

function scheduleEmptyCheck(){if(closed||!everConnected||[...peers.values()].some(p=>p.pc.connectionState==='connected'))return;if(emptyTimer)return;emptyTimer=setTimeout(async()=>{emptyTimer=null;if(closed||[...peers.values()].some(p=>p.pc.connectionState==='connected'))return;try{await signal('leave',{reason:'empty'})}catch(e){}closed=true;closeMedia();MowellNative.showMessage('Call ended because no member is active');MowellNative.finishCall()},30000)}

async function openLocalMedia(){const audio={echoCancellation:true,noiseSuppression:true,autoGainControl:true};if(!videoMode)return navigator.mediaDevices.getUserMedia({audio,video:false});let last;for(const video of [{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24,max:30}},{facingMode:{ideal:facing}}]){try{const media=await navigator.mediaDevices.getUserMedia({audio,video});const track=media.getVideoTracks()[0];if(track&&track.readyState==='live'){track.contentHint='motion';return media}media.getTracks().forEach(t=>t.stop())}catch(e){last=e}}throw last||new Error('Camera could not start')}

async function start(){try{const mediaPromise=openLocalMedia(),icePromise=loadIceConfiguration(),roomPromise=joinRoom();[stream,,room]=await Promise.all([mediaPromise,icePromise,roomPromise]);$('local').srcObject=stream;$('local').play().catch(()=>{});setTimeout(verifyLocalCamera,2500);C.group=C.group||room.group;poll();await signal('join',{video:videoMode});await Promise.all((room.peers||[]).map(async member=>{const p=await createPeer(member.id,member.name,member.avatar,false);if(C.userId.localeCompare(member.id)<0)await offerTo(member.id,p)}));setTimeout(()=>{if(!closed&&!everConnected)signal('join',{video:videoMode,retry:1}).catch(()=>{})},900);setTimeout(()=>{if(!closed&&!everConnected)signal('join',{video:videoMode,retry:2}).catch(()=>{})},2500);heartbeatTimer=setInterval(()=>{if(!closed)signal('heartbeat').catch(()=>{})},5000);if(C.initiator)unansweredTimer=setTimeout(unanswered,30000)}catch(e){if(e.code==='USER_BUSY'||String(e.message).includes('another call')){MowellNative.playBusyTone();MowellNative.showMessage('User is in another call');$('status').textContent='User is in another call';closed=true;closeMedia();setTimeout(()=>MowellNative.finishCall(),2200)}else{showError(e.message||'Camera and microphone permissions are required.')}}}

function showError(m){$('error').textContent=m;$('error').classList.remove('hidden');setTimeout(()=>$('error').classList.add('hidden'),5000)}function remoteEnd(){$('status').textContent='Call ended';closed=true;setTimeout(()=>MowellNative.finishCall(),500)}
async function hang(){if(closed)return;closed=true;if(unansweredTimer)clearTimeout(unansweredTimer);try{await signal('leave')}catch(e){}closeMedia();MowellNative.finishCall()}function closeMedia(){if(heartbeatTimer)clearInterval(heartbeatTimer);if(emptyTimer)clearTimeout(emptyTimer);if(controlsTimer)clearTimeout(controlsTimer);stream?.getTracks().forEach(t=>t.stop());peers.forEach(p=>p.pc.close());peers.clear()}window.mowellHangup=hang;window.mowellRemoteEnded=remoteEnd;window.mowellClose=()=>{closed=true;if(unansweredTimer)clearTimeout(unansweredTimer);closeMedia()};
async function switchCamera(){const old=stream?.getVideoTracks()[0];if(!old)return;try{const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const current=old.getSettings().deviceId;let constraints;if(devices.length>1){const at=Math.max(0,devices.findIndex(d=>d.deviceId===current));constraints={deviceId:{exact:devices[(at+1)%devices.length].deviceId},width:{ideal:1280},height:{ideal:720}};facing=facing==='user'?'environment':'user'}else{facing=facing==='user'?'environment':'user';constraints={facingMode:{exact:facing},width:{ideal:1280},height:{ideal:720}}}let next;try{next=await navigator.mediaDevices.getUserMedia({video:constraints})}catch(e){next=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}}})}const track=next.getVideoTracks()[0];await Promise.all([...peers.values()].map(async p=>{const sender=p.pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track)}));track.enabled=old.enabled;old.stop();stream.removeTrack(old);stream.addTrack(track);$('local').srcObject=stream;$('local').style.transform='none'}catch(e){showError('Could not switch camera on this phone.')}}
$('hang').onclick=hang;$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').classList.toggle('off',!t.enabled)}};$('camera').onclick=async()=>{const t=stream?.getVideoTracks()[0];if(!t)return enableVideo();t.enabled=!t.enabled;$('camera').classList.toggle('off',!t.enabled)};$('speaker').onclick=()=>{speaker=!speaker;MowellNative.setSpeaker(speaker);$('speaker').classList.toggle('off',!speaker)};$('flip').onclick=switchCamera;
$('stage').addEventListener('click',revealControls);$('local').addEventListener('click',e=>{e.stopPropagation();$('stage').classList.add('local-primary');revealControls()});$('grid').addEventListener('click',e=>{e.stopPropagation();$('stage').classList.remove('local-primary');revealControls()});$('add').onclick=()=>{$('memberModal').classList.remove('hidden');$('username').focus();revealControls()};$('cancelInvite').onclick=()=>{$('memberModal').classList.add('hidden');revealControls()};$('sendInvite').onclick=async()=>{const username=$('username').value.trim().replace(/^@/,'').toLowerCase();if(username.length<3)return;try{$('sendInvite').disabled=true;const result=await request('/v1/calls/'+encodeURIComponent(C.room)+'/invite',{method:'POST',body:JSON.stringify({username})});C.group=true;$('status').textContent='Invited '+result.displayName;$('memberModal').classList.add('hidden');$('username').value=''}catch(e){showError(e.message)}finally{$('sendInvite').disabled=false;revealControls()}};revealControls();start();
window.mowellSetPip=enabled=>document.body.classList.toggle('pip',!!enabled);
</script></body></html>
