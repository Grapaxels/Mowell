<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111118;color:#fff;font-family:system-ui,sans-serif}.stage{position:relative;width:100%;height:100%;background:radial-gradient(circle at 20% 15%,#40248a,#12111c 55%)}video::-webkit-media-controls{display:none!important}.grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(48%,1fr));grid-auto-rows:minmax(45%,1fr);gap:4px;padding:4px}.tile{position:relative;overflow:hidden;border-radius:18px;background:#191724}.tile video,.tile .voice-photo{width:100%;height:100%;object-fit:cover}.tile video{transform:none!important}.tile .voice-photo{padding:12%;object-fit:contain}.tile .peer{position:absolute;left:10px;bottom:9px;background:#15131acc;padding:5px 9px;border-radius:10px;font-size:12px}.waiting{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.avatar{width:112px;height:112px;border-radius:38px;display:grid;place-items:center;font-size:46px;font-weight:800;background:#7550f4;box-shadow:12px 12px 28px #07070b,-9px -9px 25px #2f2944;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-size:25px;font-weight:750;margin-top:22px}.status{color:#ccc5e8;margin-top:8px;text-align:center}.local{position:absolute;right:16px;top:18px;width:27%;max-width:155px;aspect-ratio:3/4;object-fit:cover;transform:none!important;border-radius:22px;border:2px solid #8c68ff;box-shadow:8px 8px 18px #07070a;background:#262332;z-index:3}.controls{position:absolute;left:8px;right:8px;bottom:18px;display:flex;gap:8px;justify-content:center;align-items:center;z-index:5}.control{border:0;color:#fff;width:50px;height:50px;padding:13px;border-radius:18px;background:#282533;box-shadow:7px 7px 16px #07070a,-5px -5px 13px #353047}.control svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.control.off{background:#eeeaff;color:#211b34}.control.upgrade{background:#7357f6}.control.hang{background:#ef4152;width:60px;height:60px}.control.add{background:#7357f6}.hidden{display:none!important}.error{position:absolute;left:20px;right:20px;top:20px;background:#3d1820ee;padding:13px 17px;border-radius:16px;text-align:center;z-index:8}.modal{position:absolute;inset:0;background:#08070dbb;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.panel{width:100%;max-width:390px;border-radius:26px;padding:22px;background:#24212e;box-shadow:12px 12px 28px #050506,-8px -8px 22px #373146}.panel h2{margin:0 0 8px}.panel p{margin:0 0 14px;color:#ccc5e8;font-size:13px}.panel input{width:100%;height:50px;border:1px solid #5b536e;border-radius:16px;background:#17151e;color:#fff;padding:0 14px;font-size:16px;outline:0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.actions button{border:0;border-radius:14px;padding:11px 17px;font-weight:700}.cancel{background:#383342;color:#fff}.invite{background:#dfff4f;color:#15131a}
</style></head><body><div class="stage"><div id="grid" class="grid"></div><video id="local" class="local" autoplay muted playsinline></video>
<div id="waiting" class="waiting"><div class="avatar" id="avatar">M</div><div class="name" id="name"></div><div class="status" id="status">Connecting securely...</div></div><div id="error" class="error hidden"></div>
<div class="controls">
<button id="mute" class="control" aria-label="Mute"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button>
<button id="camera" class="control" aria-label="Turn on video"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg></button>
<button id="flip" class="control" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M20 7h-4V3M4 17h4v4M19 7a8 8 0 0 0-13-2M5 17a8 8 0 0 0 13 2"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="add" class="control add" aria-label="Add member"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg></button>
<button id="speaker" class="control" aria-label="Speaker"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
<button id="hang" class="control hang" aria-label="Hang up"><svg viewBox="0 0 24 24"><path d="M4 15c4-4 12-4 16 0M7 13l-2 5M17 13l2 5"/></svg></button>
</div>
<div id="memberModal" class="modal hidden"><div class="panel"><h2>Add to call</h2><p>Enter the person's exact Mowell username. They will receive a private call invitation.</p><input id="username" autocomplete="off" placeholder="username"><div class="actions"><button id="cancelInvite" class="cancel">Cancel</button><button id="sendInvite" class="invite">Invite</button></div></div></div>
</div><script>
const C=__MOWELL_CONFIG__,$=id=>document.getElementById(id),peers=new Map();let stream,lastId='',closed=false,speaker=!!C.video,facing='user',everConnected=false,videoMode=!!C.video,unansweredTimer=null,iceServers=[{urls:['stun:35.154.86.33:3478']}];const absoluteAvatar=u=>!u?'':u.startsWith('/')?C.api+u:u;
$('name').textContent=C.name;if(C.avatar){$('avatar').innerHTML='<img alt="" src="'+absoluteAvatar(C.avatar).replace(/"/g,'')+'">'}else $('avatar').textContent=(C.name||'M').trim()[0].toUpperCase();if(!videoMode){$('local').classList.add('hidden');$('flip').classList.add('hidden');$('camera').classList.add('upgrade')}
const headers={'Authorization':'Bearer '+C.token,'Content-Type':'application/json'};
async function request(path,options={}){const r=await fetch(C.api+path,{...options,headers:{...headers,...(options.headers||{})}});const text=await r.text();let data={};if(text.trim()){try{data=JSON.parse(text)}catch(e){const html=(r.headers.get('content-type')||'').toLowerCase().includes('text/html')||/^\s*</.test(text);const error=new Error(html?'Call server returned the web page instead of call data. Deploy the latest server update.':'Call server returned invalid data.');error.status=r.status;error.code='INVALID_API_RESPONSE';throw error}}if(!r.ok){const error=new Error(data.error||('Call server error '+r.status));error.status=r.status;error.code=data.code;throw error}return data}
async function joinRoom(){let error;for(let i=0;i<(C.initiator?1:7);i++){try{return await request('/v1/calls/'+encodeURIComponent(C.room)+'/join',{method:'POST',body:JSON.stringify({conversationId:C.conversation,video:C.video,initiator:C.initiator})})}catch(e){error=e;await wait(500)}}throw error}
async function signal(type,payload={},target=null){return request('/v1/calls/'+encodeURIComponent(C.room)+'/signals',{method:'POST',body:JSON.stringify({type,payload,target})})}
async function loadIceConfiguration(){try{const data=await request('/v1/calls/ice-servers');if(Array.isArray(data.iceServers)&&data.iceServers.length)iceServers=data.iceServers}catch(e){iceServers=[{urls:['stun:35.154.86.33:3478']}]}}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function setVideoMode(){videoMode=true;C.video=true;$('local').classList.remove('hidden');$('flip').classList.remove('hidden');$('camera').classList.remove('upgrade');document.querySelectorAll('.tile video').forEach(v=>v.classList.remove('hidden'));document.querySelectorAll('.voice-photo').forEach(v=>v.classList.add('hidden'))}
function tileFor(id,name,avatar){let tile=document.getElementById('peer-'+id);if(tile)return tile.querySelector('video');tile=document.createElement('div');tile.className='tile';tile.id='peer-'+id;const video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.controls=false;if(!videoMode)video.className='hidden';tile.append(video);const photo=document.createElement('img');photo.className='voice-photo'+(videoMode?' hidden':'');photo.alt=name||'Mowell member';photo.src=absoluteAvatar(avatar)||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="28" fill="%237557f6"/><text x="50" y="64" text-anchor="middle" font-size="50" fill="white">'+encodeURIComponent((name||'M')[0].toUpperCase())+'</text></svg>';tile.append(photo);const label=document.createElement('div');label.className='peer';label.textContent=name||'Mowell member';tile.append(label);$('grid').append(tile);$('waiting').classList.add('hidden');return video}
async function offerTo(id,state){if(state.pc.signalingState!=='stable')return;const offer=await state.pc.createOffer();await state.pc.setLocalDescription(offer);await signal('offer',state.pc.localDescription,id)}
async function createPeer(id,name,avatar,offer){if(peers.has(id))return peers.get(id);const pc=new RTCPeerConnection({iceServers,iceTransportPolicy:'all'});const state={pc,pending:[],name,avatar};peers.set(id,state);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{if(e.track.kind==='video')setVideoMode();tileFor(id,name,avatar).srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate,id).catch(()=>{})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){everConnected=true;if(unansweredTimer)clearTimeout(unansweredTimer);$('status').textContent='Encrypted call'}if(pc.connectionState==='failed')showError('The secure call connection could not be established.')};if(offer)await offerTo(id,state);return state}
async function receive(s){if(s.senderId===C.userId)return;if(s.type==='join'){if(unansweredTimer)clearTimeout(unansweredTimer);await createPeer(s.senderId,s.senderName,s.senderAvatar,C.userId.localeCompare(s.senderId)<0)}else if(s.type==='media'){if(s.payload?.video){setVideoMode();$('status').textContent=s.senderName+' turned on video'}}else if(s.type==='offer'){const p=await createPeer(s.senderId,s.senderName,s.senderAvatar,false);if(p.pc.signalingState!=='stable')await p.pc.setLocalDescription({type:'rollback'}).catch(()=>{});await p.pc.setRemoteDescription(s.payload);for(const c of p.pending.splice(0))await p.pc.addIceCandidate(c);const answer=await p.pc.createAnswer();await p.pc.setLocalDescription(answer);await signal('answer',p.pc.localDescription,s.senderId)}else if(s.type==='answer'){const p=await createPeer(s.senderId,s.senderName,s.senderAvatar,false);if(!p.pc.currentRemoteDescription){await p.pc.setRemoteDescription(s.payload);for(const c of p.pending.splice(0))await p.pc.addIceCandidate(c)}}else if(s.type==='ice'){const p=await createPeer(s.senderId,s.senderName,s.senderAvatar,false);if(p.pc.remoteDescription)await p.pc.addIceCandidate(s.payload);else p.pending.push(s.payload)}else if(s.type==='leave'){const had=peers.has(s.senderId);removePeer(s.senderId);if(s.payload?.reason==='declined'&&!everConnected)$('status').textContent='Call declined';else if(had&&!C.group&&peers.size===0)remoteEnd();else if(peers.size===0)$('waiting').classList.remove('hidden')}}
function removePeer(id){const p=peers.get(id);if(p)p.pc.close();peers.delete(id);document.getElementById('peer-'+id)?.remove()}
async function poll(){while(!closed){try{const q=lastId?'?afterId='+encodeURIComponent(lastId):'';const data=await request('/v1/calls/'+encodeURIComponent(C.room)+'/signals'+q);for(const s of data.signals){lastId=s.id;await receive(s)}}catch(e){if(e.status===410){closed=true;const message=e.code==='NO_ANSWER'?"User didn't respond":'Call has ended';$('status').textContent=message;MowellNative.showMessage(message);closeMedia();setTimeout(()=>MowellNative.finishCall(),900);return}}await wait(400)}}
async function unanswered(){if(closed||everConnected)return;$('status').textContent="User didn't respond";try{await signal('leave',{reason:'no_answer'})}catch(e){}MowellNative.showMessage("User didn't respond");closeMedia();closed=true;setTimeout(()=>MowellNative.finishCall(),900)}
async function start(){try{const iceConfiguration=loadIceConfiguration();let media={audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:videoMode?{facingMode:{ideal:facing},width:{min:1280,ideal:3840},height:{min:720,ideal:2160},frameRate:{ideal:30,max:30}}:false};try{stream=await navigator.mediaDevices.getUserMedia(media)}catch(e){media.video=videoMode?{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}:false;stream=await navigator.mediaDevices.getUserMedia(media)}await iceConfiguration;$('local').srcObject=stream;const room=await joinRoom();C.group=C.group||room.group;poll();await signal('join',{video:videoMode});if(C.initiator)unansweredTimer=setTimeout(unanswered,45000)}catch(e){if(e.code==='USER_BUSY'||String(e.message).includes('another call')){MowellNative.playBusyTone();MowellNative.showMessage('User is in another call');$('status').textContent='User is in another call';closed=true;closeMedia();setTimeout(()=>MowellNative.finishCall(),2200)}else{showError(e.message||'Camera and microphone permissions are required.')}}}
async function enableVideo(){if(stream?.getVideoTracks().length)return;try{const camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});const track=camera.getVideoTracks()[0];stream.addTrack(track);$('local').srcObject=stream;setVideoMode();speaker=true;MowellNative.setSpeaker(true);$('speaker').classList.remove('off');for(const [id,state] of peers){state.pc.addTrack(track,stream);await offerTo(id,state)}await signal('media',{video:true}).catch(()=>{});$('status').textContent='Video is on'}catch(e){showError('Camera could not be started. Check camera permission.')}}
function showError(m){$('error').textContent=m;$('error').classList.remove('hidden');setTimeout(()=>$('error').classList.add('hidden'),5000)}function remoteEnd(){$('status').textContent='Call ended';closed=true;setTimeout(()=>MowellNative.finishCall(),500)}
async function hang(){if(closed)return;closed=true;if(unansweredTimer)clearTimeout(unansweredTimer);try{await signal('leave')}catch(e){}closeMedia();MowellNative.finishCall()}function closeMedia(){stream?.getTracks().forEach(t=>t.stop());peers.forEach(p=>p.pc.close());peers.clear()}window.mowellHangup=hang;window.mowellRemoteEnded=remoteEnd;window.mowellClose=()=>{closed=true;if(unansweredTimer)clearTimeout(unansweredTimer);closeMedia()};
async function switchCamera(){const old=stream?.getVideoTracks()[0];if(!old)return;try{const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');const current=old.getSettings().deviceId;let constraints;if(devices.length>1){const at=Math.max(0,devices.findIndex(d=>d.deviceId===current));constraints={deviceId:{exact:devices[(at+1)%devices.length].deviceId},width:{ideal:1280},height:{ideal:720}};facing=facing==='user'?'environment':'user'}else{facing=facing==='user'?'environment':'user';constraints={facingMode:{exact:facing},width:{ideal:1280},height:{ideal:720}}}let next;try{next=await navigator.mediaDevices.getUserMedia({video:constraints})}catch(e){next=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}}})}const track=next.getVideoTracks()[0];await Promise.all([...peers.values()].map(async p=>{const sender=p.pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track)}));track.enabled=old.enabled;old.stop();stream.removeTrack(old);stream.addTrack(track);$('local').srcObject=stream;$('local').style.transform='none'}catch(e){showError('Could not switch camera on this phone.')}}
$('hang').onclick=hang;$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').classList.toggle('off',!t.enabled)}};$('camera').onclick=async()=>{const t=stream?.getVideoTracks()[0];if(!t)return enableVideo();t.enabled=!t.enabled;$('camera').classList.toggle('off',!t.enabled)};$('speaker').onclick=()=>{speaker=!speaker;MowellNative.setSpeaker(speaker);$('speaker').classList.toggle('off',!speaker)};$('flip').onclick=switchCamera;
$('add').onclick=()=>{$('memberModal').classList.remove('hidden');$('username').focus()};$('cancelInvite').onclick=()=>{$('memberModal').classList.add('hidden')};$('sendInvite').onclick=async()=>{const username=$('username').value.trim().replace(/^@/,'').toLowerCase();if(username.length<3)return;try{$('sendInvite').disabled=true;const result=await request('/v1/calls/'+encodeURIComponent(C.room)+'/invite',{method:'POST',body:JSON.stringify({username})});C.group=true;$('status').textContent='Invited '+result.displayName;$('memberModal').classList.add('hidden');$('username').value=''}catch(e){showError(e.message)}finally{$('sendInvite').disabled=false}};start();
</script></body></html>
