<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111118;color:#fff;font-family:system-ui,sans-serif}.stage{position:relative;width:100%;height:100%;background:radial-gradient(circle at 20% 15%,#40248a,#12111c 55%)}video{object-fit:cover}.remote{width:100%;height:100%;background:#171620}.local{position:absolute;right:18px;top:22px;width:31%;max-width:180px;aspect-ratio:3/4;border-radius:24px;border:2px solid #8c68ff;box-shadow:8px 8px 18px #07070a,-6px -6px 16px #322b49;background:#262332}.audio-card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.avatar{width:112px;height:112px;border-radius:38px;display:grid;place-items:center;font-size:46px;font-weight:800;background:#7550f4;box-shadow:12px 12px 28px #07070b,-9px -9px 25px #2f2944}.name{font-size:25px;font-weight:750;margin-top:22px}.status{color:#ccc5e8;margin-top:8px}.controls{position:absolute;left:0;right:0;bottom:24px;display:flex;gap:13px;justify-content:center;align-items:center;padding:0 12px}.control{border:0;color:#fff;width:58px;height:58px;border-radius:21px;background:#282533;font-size:22px;box-shadow:7px 7px 16px #07070a,-5px -5px 13px #353047}.control.off{background:#eeeaff;color:#211b34}.hang{background:#ef4152;width:66px;height:66px}.hidden{display:none}.error{position:absolute;left:20px;right:20px;top:24px;background:#3d1820dd;padding:13px 17px;border-radius:16px;text-align:center}
</style></head><body><div class="stage">
<video id="remote" class="remote" autoplay playsinline></video><video id="local" class="local" autoplay muted playsinline></video>
<div id="audioCard" class="audio-card"><div class="avatar" id="avatar">M</div><div class="name" id="name"></div><div class="status" id="status">Connecting securely…</div></div>
<div id="error" class="error hidden"></div>
<div class="controls"><button id="mute" class="control" aria-label="Mute">🎙</button><button id="camera" class="control" aria-label="Camera">📹</button><button id="flip" class="control" aria-label="Switch camera">↻</button><button id="speaker" class="control" aria-label="Speaker">🔊</button><button id="hang" class="control hang" aria-label="Hang up">✕</button></div>
</div><script>
const C=__MOWELL_CONFIG__, $=id=>document.getElementById(id); let pc,stream,lastId='',closed=false,pendingIce=[],speaker=!!C.video,facing='user';
$('name').textContent=C.name;$('avatar').textContent=(C.name||'M').trim()[0].toUpperCase();if(!C.video){$('local').classList.add('hidden');$('camera').classList.add('hidden');$('flip').classList.add('hidden')}else $('audioCard').classList.add('hidden');
const headers={'Authorization':'Bearer '+C.token,'Content-Type':'application/json'};
async function signal(type,payload={}){await fetch(C.api+'/v1/calls/'+encodeURIComponent(C.room)+'/signals',{method:'POST',headers,body:JSON.stringify({conversationId:C.conversation,type,payload})})}
async function poll(){while(!closed){try{const q='?conversationId='+encodeURIComponent(C.conversation)+(lastId?'&afterId='+encodeURIComponent(lastId):'');const r=await fetch(C.api+'/v1/calls/'+encodeURIComponent(C.room)+'/signals'+q,{headers});if(r.ok){const data=await r.json();for(const s of data.signals){lastId=s.id;await receive(s)}}}catch(e){}await new Promise(r=>setTimeout(r,450))}}
async function receive(s){if(s.type==='offer'&&!C.initiator){await pc.setRemoteDescription(s.payload);for(const i of pendingIce.splice(0))await pc.addIceCandidate(i);const a=await pc.createAnswer();await pc.setLocalDescription(a);await signal('answer',pc.localDescription)}else if(s.type==='answer'&&C.initiator){await pc.setRemoteDescription(s.payload);for(const i of pendingIce.splice(0))await pc.addIceCandidate(i)}else if(s.type==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(s.payload);else pendingIce.push(s.payload)}else if(s.type==='hangup'){remoteEnd()}}
async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:C.video?{facingMode:facing,width:{ideal:1280},height:{ideal:720}}:false});$('local').srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.ontrack=e=>{$('remote').srcObject=e.streams[0];$('status').textContent='Connected'};pc.onicecandidate=e=>{if(e.candidate)signal('ice',e.candidate)};pc.onconnectionstatechange=()=>{const s=pc.connectionState;$('status').textContent=s==='connected'?'Encrypted call':s==='failed'?'Could not connect':s;if(s==='failed')showError('Direct connection was blocked by this network.')};poll();if(C.initiator){const o=await pc.createOffer();await pc.setLocalDescription(o);await signal('offer',pc.localDescription)}}catch(e){showError('Camera or microphone permission is required.')}}
function showError(m){$('error').textContent=m;$('error').classList.remove('hidden')}function remoteEnd(){$('status').textContent='Call ended';closed=true;setTimeout(()=>MowellNative.finishCall(),500)}
async function hang(){if(closed)return;closed=true;try{await signal('hangup')}catch(e){}closeMedia();MowellNative.finishCall()}function closeMedia(){stream&&stream.getTracks().forEach(t=>t.stop());pc&&pc.close()}window.mowellHangup=hang;window.mowellRemoteEnded=remoteEnd;window.mowellClose=()=>{closed=true;closeMedia()};
$('hang').onclick=hang;$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').classList.toggle('off',!t.enabled)}};$('camera').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('camera').classList.toggle('off',!t.enabled)}};$('speaker').onclick=()=>{speaker=!speaker;MowellNative.setSpeaker(speaker);$('speaker').classList.toggle('off',!speaker)};$('flip').onclick=async()=>{const old=stream?.getVideoTracks()[0];if(!old)return;facing=facing==='user'?'environment':'user';const next=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});const track=next.getVideoTracks()[0];await pc.getSenders().find(s=>s.track?.kind==='video').replaceTrack(track);old.stop();stream.removeTrack(old);stream.addTrack(track);$('local').srcObject=stream};start();
</script></body></html>
