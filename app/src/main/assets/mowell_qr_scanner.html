<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09090b;color:#fff;font-family:system-ui,sans-serif}.scanner{position:relative;width:100%;height:100%}video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(#0009,#0002 28%,#0002 72%,#0009);pointer-events:none}.frame{position:absolute;left:50%;top:48%;width:min(76vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #8d79f2;border-radius:24px;box-shadow:0 0 0 999px #0004}.top{position:absolute;left:20px;right:20px;top:30px;text-align:center}.top h1{font-size:22px;margin:0 0 7px}.top p{margin:0;color:#ddd}.manual{position:absolute;left:20px;right:20px;bottom:28px;background:#171719e8;border-radius:18px;padding:14px}.manual p{font-size:12px;color:#aaa6b2;margin:0 0 8px}.row{display:flex;gap:8px}.row input{min-width:0;flex:1;border:1px solid #3a3a40;background:#252529;color:#fff;border-radius:12px;padding:12px;text-transform:uppercase;letter-spacing:2px}.row button{border:0;border-radius:12px;padding:0 16px;background:#6852d6;color:#fff;font-weight:700}.status{position:absolute;left:20px;right:20px;bottom:116px;text-align:center;background:#0009;border-radius:10px;padding:8px;font-size:12px}.hidden{display:none}
</style></head><body><div class="scanner"><video id="camera" autoplay muted playsinline></video><div class="shade"></div><div class="frame"></div><div class="top"><h1>Scan Mowell Web QR</h1><p>Keep the code inside the square</p></div><div id="status" class="status">Starting camera…</div><div class="manual"><p>If scanning is unavailable, enter the pairing code shown below the QR.</p><div class="row"><input id="code" maxlength="14" placeholder="PAIRING CODE"><button id="link">Link</button></div></div></div><script>
let stream=null,stopped=false;const video=document.getElementById('camera'),status=document.getElementById('status');function finish(value){if(stopped||!value)return;stopped=true;stream?.getTracks().forEach(track=>track.stop());MowellScanner.found(String(value))}async function scan(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();if(!('BarcodeDetector'in window)){status.textContent='Live QR detection is unavailable on this WebView. Enter the pairing code below.';return}const detector=new BarcodeDetector({formats:['qr_code']});status.textContent='Point the camera at the QR code';while(!stopped){try{const codes=await detector.detect(video);const value=codes.find(code=>String(code.rawValue||'').startsWith('mowell://link?'))?.rawValue;if(value){finish(value);return}}catch(e){}await new Promise(resolve=>setTimeout(resolve,180))}}catch(e){status.textContent='Camera could not start. Allow camera access or enter the pairing code below.'}}document.getElementById('link').onclick=()=>{const value=document.getElementById('code').value.replace(/[^a-fA-F0-9]/g,'').toUpperCase();if(value.length>=8)finish(value);else status.textContent='Enter the complete pairing code'};window.stopScanner=()=>{stopped=true;stream?.getTracks().forEach(track=>track.stop())};scan();
</script></body></html>
